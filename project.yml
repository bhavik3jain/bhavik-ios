name: bhavik-ios
options:
  bundleIdPrefix: com.bhavikjain
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

packages:
  Core:
    path: Packages/Core
  GymTracker:
    path: Packages/GymTracker
  FuelTracker:
    path: Packages/FuelTracker
  TVTracker:
    path: Packages/TVTracker
  ParcelTracker:
    path: Packages/ParcelTracker
  TripTracker:
    path: Packages/TripTracker
  ExploreTracker:
    path: Packages/ExploreTracker
  PointsTracker:
    path: Packages/PointsTracker
  FinanceTracker:
    path: Packages/FinanceTracker

targets:
  bhavik-ios:
    type: application
    platform: iOS
    # A scheme of its own, generated rather than left to Xcode: once
    # project.yml declared the AllPackageTests scheme, Xcode stopped creating
    # a default one for this target, and the TestFlight archive failed with
    # "does not contain a scheme named bhavik-ios".
    scheme: {}
    sources: &appSources
      # XcodeGen has no separate "resources" key: everything goes in sources and
      # Xcode sorts it into the right build phase by file type. Listing the asset
      # catalog under "resources" silently did nothing, leaving the app iconless.
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikjain.trackers
        # Signing lives here, not in Xcode's Signing & Capabilities tab: the
        # .xcodeproj is generated, so anything set in the GUI is lost on the
        # next `xcodegen generate`.
        DEVELOPMENT_TEAM: Y4M3S6H4NK
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        CODE_SIGN_ENTITLEMENTS: App/Resources/App.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_UILaunchScreen_Generation: "YES"
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    dependencies: &appDependencies
      - package: Core
      - package: GymTracker
      - package: FuelTracker
      - package: TVTracker
      - package: ParcelTracker
      - package: TripTracker
      - package: ExploreTracker
      - package: PointsTracker
      - package: FinanceTracker
    info:
      path: App/Resources/Info.plist
      properties:
        CFBundleDisplayName: Multitrack
        UILaunchScreen: {}
        UIBackgroundModes:
          - remote-notification
        # Lets you drop a Fuelly CSV into the app's folder from Finder or the Files app.
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        # The app only talks HTTPS, which is an exempt use of encryption, so
        # declaring this stops App Store Connect asking the export-compliance
        # question on every single upload.
        ITSAppUsesNonExemptEncryption: false
        # Asked for only when a guide's map or a trip's Nearby tab opens, never
        # at launch. Without the key the request is dropped silently: the blue
        # dot never appears and Nearby can only measure from a day's plan.
        NSLocationWhenInUseUsageDescription: Shows how far you are from the places in a guide and the ideas saved for a trip.
        # Without this, tapping a CloudKit share-invitation link (email, Messages)
        # never routes into the app at all — the system silently drops it before
        # userDidAcceptCloudKitShareWith is ever called.
        CKSharingSupported: true
        # What a trip's stop or idea is while it's dragged between the Mac's
        # plan and its Ideas inspector (`UTType.tripItineraryItem`). Undeclared,
        # an exported identifier is treated as a dynamic type and the drop
        # destination waiting for it never matches. Declared on both targets so
        # the type means the same thing wherever a trip is open.
        UTExportedTypeDeclarations: &itineraryItemType
          - UTTypeIdentifier: com.bhavikjain.trackers.itinerary-item
            UTTypeDescription: Trip Stop
            UTTypeConformsTo:
              - public.data

  # Same code, same packages, same bundle id — only the platform chrome differs.
  # Sources and dependencies are aliased from the iOS target rather than copied
  # so that adding a package can't leave the Mac build a module behind.
  bhavik-macOS:
    type: application
    platform: macOS
    # See bhavik-ios: generated so CI and TestFlight never depend on Xcode
    # making a default scheme.
    scheme: {}
    # Lives on the target, not in options.deploymentTarget, so that adding the
    # Mac build writes nothing into the settings the shipping iOS app inherits.
    deploymentTarget: "15.0"
    sources:
      - path: App/Sources
      - path: App/Resources/Assets.xcassets
      # Finance's Export to Numbers (App/Sources/MacFinanceNumbers.swift) fills
      # the committed template with the scripts' own fill script, so the Mac
      # app and scripts/finance can never drift apart. Mac only: the phone
      # can't script Numbers.
      - path: scripts/finance/Finance Template.numbers
        buildPhase: resources
      - path: scripts/finance/numbers_fill.js
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.bhavikjain.trackers
        DEVELOPMENT_TEAM: Y4M3S6H4NK
        CODE_SIGN_STYLE: Automatic
        # On the Mac the bundle name is visible in a way it never is on
        # iPhone: it names the app in Finder, the menu bar and the About
        # box. Left alone it inherits the target name and reads
        # "bhavik-macOS".
        PRODUCT_NAME: Multitrack
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        # Kept from the retired Developer ID route, whose notary service
        # refused anything without it ("The executable does not have the
        # hardened runtime enabled"). The App Store doesn't require it, but the
        # Apple-events entitlement in App-macOS.entitlements is written for it.
        # Xcode adds the debugging entitlement itself for a Debug,
        # Automatic-signed build, so local development is unaffected.
        ENABLE_HARDENED_RUNTIME: "YES"
        # A separate entitlements file, because CloudKit on macOS only works
        # from a sandboxed app and the sandbox then has to be opened back up
        # for outbound HTTPS and for the CSV import.
        CODE_SIGN_ENTITLEMENTS: App/Resources/App-macOS.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Deliberately absent: TARGETED_DEVICE_FAMILY,
        # INFOPLIST_KEY_UILaunchScreen_Generation and
        # INFOPLIST_KEY_UISupportedInterfaceOrientations are iOS-only and make
        # the Mac build warn.
    dependencies: *appDependencies
    info:
      # Its own plist: the iOS one carries launch-screen, background-mode and
      # file-sharing keys that mean nothing on the Mac.
      path: App/Resources/Info-macOS.plist
      properties:
        CFBundleDisplayName: Multitrack
        # Required by the Mac App Store: an upload without a category fails
        # validation.
        LSApplicationCategoryType: public.app-category.productivity
        # Stops the Mac app launching on a system too old to run it, where it
        # would only get as far as a dyld crash.
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        ITSAppUsesNonExemptEncryption: false
        # Same prompt as on iPhone; see also the location key in
        # App-macOS.entitlements, which the sandbox needs as well.
        NSLocationWhenInUseUsageDescription: Shows how far you are from the places in a guide and the ideas saved for a trip.
        # Same as the iOS target: required for a tapped CloudKit share link to
        # route into the app instead of being silently dropped.
        CKSharingSupported: true
        # See the iOS target.
        UTExportedTypeDeclarations: *itineraryItemType
        # The Automation prompt for Finance's Export to Numbers, which drives
        # Numbers. Without it the hardened runtime refuses every Apple event
        # (-1743) and the prompt never appears. See also App-macOS.entitlements.
        NSAppleEventsUsageDescription: Multitrack fills your Finance template in Numbers when you export a month.

schemes:
  # Every package's tests in one scheme, so CI builds Core once instead of once
  # per package. Nine separate `xcodebuild test` runs took 29 minutes on the
  # xcode-27 runner, nearly all of it rebuilding the same dependencies; the
  # tests themselves run in seconds. The per-package schemes still exist for
  # running one suite locally.
  AllPackageTests:
    # XcodeGen needs a build target in every scheme; the app, built only for the
    # test action, satisfies that and costs little next to nine rebuilds of Core.
    build:
      targets:
        bhavik-ios: [test]
    test:
      parallelizeBuild: true
      targets:
        - package: Core/CoreTests
          parallelizable: true
        - package: GymTracker/GymTrackerTests
          parallelizable: true
        - package: FuelTracker/FuelTrackerTests
          parallelizable: true
        - package: TVTracker/TVTrackerTests
          parallelizable: true
        - package: ParcelTracker/ParcelTrackerTests
          parallelizable: true
        - package: TripTracker/TripTrackerTests
          parallelizable: true
        - package: ExploreTracker/ExploreTrackerTests
          parallelizable: true
        - package: PointsTracker/PointsTrackerTests
          parallelizable: true
        - package: FinanceTracker/FinanceTrackerTests
          parallelizable: true
