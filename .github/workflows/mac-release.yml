name: Mac Release

# Manual only, for now. This is the first Mac distribution this repo has ever
# had — there's no App Store listing and no tag convention for it yet. Add a
# `push: tags: ["mac-v*"]` trigger later if repeat releases turn out to want
# one.
on:
  workflow_dispatch:

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, notarize and package
    runs-on: macos-latest

    # Reuses the same environment — and the same App Store Connect key — as
    # TestFlight. The key's Admin role (already required for iOS cloud-managed
    # signing) also covers minting a Developer ID Application certificate and
    # authorizing notarization, so nothing new has to be provisioned for this.
    environment: testflight

    env:
      # Purely informational: there is no App Store review to keep a build
      # number unique for, so this only has to be a legal three-integer
      # version, not actually monotonic against anything.
      BUILD_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the App Store Connect API key
        # Same reasoning as testflight.yml: cloud-managed signing means there is
        # no certificate to import, so provisioning and notarization both
        # authenticate with this key instead.
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          build_number=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "Building $build_number"

          xcodebuild archive \
            -project bhavik-ios.xcodeproj \
            -scheme bhavik-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build_number"

      - name: Export, signed for Developer ID
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>Y4M3S6H4NK</string>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Notarize
        # A Developer ID export is signed but not notarized — Gatekeeper will
        # still refuse to launch it on a Mac that isn't this one until Apple's
        # notary service has scanned and stapled a ticket to it.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Multitrack.app"
          zip="$RUNNER_TEMP/Multitrack-for-notarization.zip"

          # notarytool takes a zip, not the .app itself; -k --keepParent keeps
          # the top-level Multitrack.app entry the notary service expects.
          ditto -c -k --keepParent "$app" "$zip"

          if ! xcrun notarytool submit "$zip" \
              --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait \
              --output-format json > "$RUNNER_TEMP/notary-result.json"; then
            echo "Submission failed outright — see above."
            exit 1
          fi

          cat "$RUNNER_TEMP/notary-result.json"
          status=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/notary-result.json'))['status'])")

          if [ "$status" != "Accepted" ]; then
            echo "Notarization did not succeed (status: $status). Fetching the log:"
            submission_id=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-result.json'))['id'])")
            xcrun notarytool log "$submission_id" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Package as a disk image
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Multitrack.app"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "Multitrack" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "$RUNNER_TEMP/Multitrack.dmg"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Multitrack-macOS
          path: ${{ runner.temp }}/Multitrack.dmg
          if-no-files-found: error

      - name: Clean up the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH" || true
