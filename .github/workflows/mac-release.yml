name: Mac Release

# Manual only, for now. This is the first Mac distribution this repo has ever
# had — there's no App Store listing and no tag convention for it yet. Add a
# `push: tags: ["mac-v*"]` trigger later if repeat releases turn out to want
# one.
on:
  workflow_dispatch:

concurrency:
  group: mac-release
  cancel-in-progress: false

jobs:
  release:
    name: Archive, notarize and package
    runs-on: macos-latest

    # Reuses the same environment as TestFlight, plus two secrets of its own:
    # MAC_DEVELOPER_ID_P12 (base64) and MAC_DEVELOPER_ID_P12_PASSWORD. Cloud
    # managed signing — what the App Store Connect key does for iOS — only
    # covers App Store distribution; Apple never holds a Developer ID private
    # key for you, by design, since that's the whole point of Developer ID.
    # So this one genuinely needs an imported certificate, unlike testflight.yml.
    environment: testflight

    env:
      # Purely informational: there is no App Store review to keep a build
      # number unique for, so this only has to be a legal three-integer
      # version, not actually monotonic against anything.
      BUILD_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Write the App Store Connect API key
        # Profile management (matching the imported certificate below to a
        # Developer ID provisioning profile for com.bhavikjain.trackers) and
        # notarization both still authenticate with this key — only the
        # certificate itself can't come from it.
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Import the Developer ID certificate
        # A fresh, disposable keychain rather than the runner's login keychain,
        # so this never lingers past the job and never collides with whatever
        # else runs on a reused runner. The partition-list line is what lets
        # codesign use the key non-interactively — without it, macOS prompts
        # for keychain access, which has nothing to prompt on a CI runner and
        # just hangs the job instead.
        env:
          MAC_DEVELOPER_ID_P12: ${{ secrets.MAC_DEVELOPER_ID_P12 }}
          MAC_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MAC_DEVELOPER_ID_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          p12_path="$RUNNER_TEMP/developer-id.p12"

          echo "$MAC_DEVELOPER_ID_P12" | base64 --decode > "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"

          security import "$p12_path" -k "$keychain" -P "$MAC_DEVELOPER_ID_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"

          # Bring it into the search list rather than replacing it, so the
          # runner's own default/login keychain (and whatever identities Xcode
          # itself expects to find there) stays reachable too.
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$p12_path"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"
          echo "SIGNING_KEYCHAIN_PASSWORD=$keychain_password" >> "$GITHUB_ENV"

      - name: Install the Developer ID provisioning profile
        # The app's entitlements (iCloud, WeatherKit) mean Apple requires an
        # explicit profile even for Developer ID — cloud-managed signing can't
        # create one (same categorical restriction as the certificate), so
        # this is downloaded from the portal by hand, once, like the
        # certificate. Xcode finds profiles here by filename; the name itself
        # doesn't matter, only its UUID and its contents.
        #
        # Its entitlements are frozen at generation: a capability added to
        # App-macOS.entitlements later (CloudKit pushes'
        # com.apple.developer.aps-environment was the first) fails signing
        # here until the profile is regenerated in the portal and this secret
        # replaced — README → macOS → Installing it has the steps.
        env:
          MAC_DEVELOPER_ID_PROFILE: ${{ secrets.MAC_DEVELOPER_ID_PROFILE }}
        run: |
          set -euo pipefail
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          echo "$MAC_DEVELOPER_ID_PROFILE" | base64 --decode \
            > "$HOME/Library/MobileDevice/Provisioning Profiles/mac-release.provisionprofile"

      - name: Generate the project
        run: xcodegen generate

      - name: Archive
        # Signed manually with the Developer ID certificate and profile
        # already installed — not -allowProvisioningUpdates. That flag asked
        # cloud-managed signing to mint a throwaway Mac Development
        # certificate for the archive step's own intermediate signing, on
        # every run, with nothing here to reuse one from a previous run; after
        # a handful of runs that hit "Your account has reached the maximum
        # number of certificates." There's a real Developer ID identity
        # already available, and archiving with the exact identity the export
        # will use anyway removes the need to touch cloud signing at all.
        run: |
          set -euo pipefail
          build_number=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "Building $build_number"

          xcodebuild archive \
            -project bhavik-ios.xcodeproj \
            -scheme bhavik-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            PROVISIONING_PROFILE_SPECIFIER="Multitrack Developer ID" \
            DEVELOPMENT_TEAM=Y4M3S6H4NK \
            CURRENT_PROJECT_VERSION="$build_number"

      - name: Export, signed for Developer ID
        # No -allowProvisioningUpdates and no -authenticationKey* here, on
        # purpose: passing them is what caused "Cloud signing permission
        # error" even with the real certificate already imported — Apple's
        # cloud-managed signing (the API-key path) refuses the developer-id
        # method outright, categorically, regardless of what's in the local
        # keychain. Signing manually with the certificate that's actually
        # there is the whole point of having imported it.
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>developer-id</string>
              <key>teamID</key>
              <string>Y4M3S6H4NK</string>
              <key>signingStyle</key>
              <string>manual</string>
              <key>signingCertificate</key>
              <string>Developer ID Application</string>
              <key>provisioningProfiles</key>
              <dict>
                  <key>com.bhavikjain.trackers</key>
                  <!-- The profile's own Name field, as the developer portal
                       shows it — not a filename or the UUID. -->
                  <string>Multitrack Developer ID</string>
              </dict>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"

      - name: Notarize
        # A Developer ID export is signed but not notarized — Gatekeeper will
        # still refuse to launch it on a Mac that isn't this one until Apple's
        # notary service has scanned and stapled a ticket to it.
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Multitrack.app"
          zip="$RUNNER_TEMP/Multitrack-for-notarization.zip"

          # notarytool takes a zip, not the .app itself; -k --keepParent keeps
          # the top-level Multitrack.app entry the notary service expects.
          ditto -c -k --keepParent "$app" "$zip"

          if ! xcrun notarytool submit "$zip" \
              --key "$ASC_KEY_PATH" \
              --key-id "$ASC_KEY_ID" \
              --issuer "$ASC_ISSUER_ID" \
              --wait \
              --output-format json > "$RUNNER_TEMP/notary-result.json"; then
            echo "Submission failed outright — see above."
            exit 1
          fi

          cat "$RUNNER_TEMP/notary-result.json"
          status=$(python3 -c "import json; print(json.load(open('$RUNNER_TEMP/notary-result.json'))['status'])")

          if [ "$status" != "Accepted" ]; then
            echo "Notarization did not succeed (status: $status). Fetching the log:"
            submission_id=$(python3 -c "import json;print(json.load(open('$RUNNER_TEMP/notary-result.json'))['id'])")
            xcrun notarytool log "$submission_id" \
              --key "$ASC_KEY_PATH" --key-id "$ASC_KEY_ID" --issuer "$ASC_ISSUER_ID"
            exit 1
          fi

          xcrun stapler staple "$app"
          xcrun stapler validate "$app"
          spctl --assess --type execute --verbose "$app"

      - name: Package as a disk image
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/export/Multitrack.app"
          staging="$RUNNER_TEMP/dmg"
          mkdir -p "$staging"
          cp -R "$app" "$staging/"
          ln -s /Applications "$staging/Applications"

          hdiutil create \
            -volname "Multitrack" \
            -srcfolder "$staging" \
            -ov -format UDZO \
            "$RUNNER_TEMP/Multitrack.dmg"

      - name: Upload the disk image
        uses: actions/upload-artifact@v4
        with:
          name: Multitrack-macOS
          path: ${{ runner.temp }}/Multitrack.dmg
          if-no-files-found: error

      - name: Clean up the API key and signing keychain
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" || true
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi
