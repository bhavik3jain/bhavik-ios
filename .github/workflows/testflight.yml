name: TestFlight

# Deliberate uploads only. Running this on every push to main would turn each
# work-in-progress commit into a build TestFlight offers to install on the
# phone, so it's driven by a version tag or a manual run instead. The Tests
# workflow still runs on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: xcode-27

    # The App Store Connect key lives in this environment rather than in
    # repository secrets, so it's reachable only from main and v* tags.
    # Repository secrets would be readable by any workflow on any branch,
    # including the Tests workflow that runs on pull requests. The key can mint
    # signing certificates and ship builds, and the .p8 cannot be re-downloaded.
    environment: testflight

    env:
      # App Store Connect rejects a build number it has seen before, so this has
      # to only ever go up. run_number is monotonic per workflow and never
      # repeats, even across force-pushes and re-runs; the offset clears the
      # builds uploaded by hand before this workflow existed.
      BUILD_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.0
        # Pinned, not "newest installed": the xcode-27 image also carries 27.1
        # and a 27.2 beta, and App Store Connect rejects a build made with a
        # beta Xcode. Moved off macos-latest (Xcode 26.6) after its compiler
        # crashed in IRGen on SharedChangeNotificationsSection.swift while the
        # app is developed on Xcode 27. The image is a GitHub preview, so jobs
        # can queue; falling back is runs-on: macos-latest plus this step
        # picking the newest Xcode again.
        run: |
          xcode=/Applications/Xcode_27.0.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        # xcbeautify turns xcodebuild's output into readable GitHub annotations.
        # Without it the logs were either thousands of lines or, with -quiet, a
        # red "error: the following command failed with exit code 0" after every
        # compile step that merely had warnings, which read as failures when the
        # build had passed. Every xcodebuild below pipes into it under
        # `set -o pipefail`, so a real failure still fails the step.
        run: brew install xcodegen xcbeautify

      - name: Import the Apple Development certificate
        # Distribution signing is cloud-managed (Apple holds that key), but the
        # archive itself is signed with a development identity first. With none
        # on a fresh runner, -allowProvisioningUpdates made a new "Created by
        # API" development certificate every run, until the account hit its
        # certificate limit and archives failed with "Choose a certificate to
        # revoke". Importing one fixed certificate lets Xcode reuse it.
        # A disposable keychain, deleted in the last step; the partition list is
        # what lets codesign use the key without a prompt that would hang CI.
        env:
          IOS_DEV_P12: ${{ secrets.IOS_DEV_P12 }}
          IOS_DEV_P12_PASSWORD: ${{ secrets.IOS_DEV_P12_PASSWORD }}
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          p12_path="$RUNNER_TEMP/development.p12"

          echo "$IOS_DEV_P12" | base64 --decode > "$p12_path"

          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$p12_path" -k "$keychain" -P "$IOS_DEV_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | sed 's/"//g')

          rm -f "$p12_path"
          echo "SIGNING_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Write the App Store Connect API key
        # CI can't use the interactively signed-in Xcode account, so both
        # provisioning and the upload authenticate with an API key instead.
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate the project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          build_number=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "Building $build_number"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project bhavik-ios.xcodeproj \
            -scheme bhavik-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build_number" | xcbeautify --renderer github-actions

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>Y4M3S6H4NK</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify --renderer github-actions

          echo "Uploaded build $BUILD_NUMBER — it will appear in TestFlight once processing finishes."

      - name: Clean up the API key and signing keychain
        # Runs even on failure so a failed archive never leaves the API key or
        # the certificate sitting on the runner.
        if: always()
        run: |
          rm -f "$ASC_KEY_PATH" || true
          if [ -n "${SIGNING_KEYCHAIN:-}" ]; then
            security delete-keychain "$SIGNING_KEYCHAIN" || true
          fi

  mac:
    name: Archive and upload the Mac app
    # The Mac build of the same App Store Connect app (Universal Purchase:
    # one bundle id, com.bhavikjain.trackers, on both platforms), so it lands
    # in the same TestFlight. Its own job, alongside the iPhone one, so a
    # failure here never holds the phone build back.
    runs-on: xcode-27
    environment: testflight

    env:
      # Build numbers are per platform in App Store Connect; sharing the
      # iPhone job's keeps one run's two builds easy to match.
      BUILD_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.0
        # See the iPhone job.
        run: |
          xcode=/Applications/Xcode_27.0.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        run: brew install xcodegen xcbeautify

      - name: Write the App Store Connect API key
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate the project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Archive, signed ad hoc with the app's entitlements
        # A Mac archive can't be development-signed here the way the iPhone
        # one is: a Mac development profile only covers registered Macs, and a
        # runner isn't one. Signing manually without a profile is refused
        # outright ("requires a provisioning profile") because CloudKit and
        # push need one. So the archive is built unsigned and then signed ad
        # hoc with the entitlements resolved by hand; unsigned, it would carry
        # none, and the export below would sign the app without its sandbox or
        # CloudKit. The export replaces this signature with the App Store one
        # (cloud-managed, through the API key) and takes aps-environment from
        # the App Store profile.
        run: |
          set -euo pipefail
          build_number=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "Building $build_number"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"
          archive="$RUNNER_TEMP/Multitrack-macOS.xcarchive"

          xcodebuild archive \
            -project bhavik-ios.xcodeproj \
            -scheme bhavik-macOS \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -archivePath "$archive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$build_number" | xcbeautify --renderer github-actions

          entitlements="$RUNNER_TEMP/Multitrack-macOS.entitlements"
          sed -e 's/\$(TeamIdentifierPrefix)/Y4M3S6H4NK./g' \
              -e 's/\$(CFBundleIdentifier)/com.bhavikjain.trackers/g' \
              App/Resources/App-macOS.entitlements > "$entitlements"
          app="$archive/Products/Applications/Multitrack.app"
          codesign --force --sign - --options runtime --timestamp=none --entitlements "$entitlements" "$app"
          codesign -d --entitlements - "$app"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions-macOS.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>Y4M3S6H4NK</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Multitrack-macOS.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-macOS.plist" \
            -exportPath "$RUNNER_TEMP/export-macOS" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" | xcbeautify --renderer github-actions

          echo "Uploaded Mac build $BUILD_NUMBER — it will appear in TestFlight once processing finishes."

      - name: Clean up the API key
        if: always()
        run: rm -f "$ASC_KEY_PATH" || true
