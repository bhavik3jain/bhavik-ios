name: TestFlight

# Deliberate uploads only. Running this on every push to main would turn each
# work-in-progress commit into a build TestFlight offers to install on the
# phone, so it's driven by a version tag or a manual run instead. The Tests
# workflow still runs on every push.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: testflight
  cancel-in-progress: false

jobs:
  upload:
    name: Archive and upload
    runs-on: macos-latest

    # The App Store Connect key lives in this environment rather than in
    # repository secrets, so it's reachable only from main and v* tags.
    # Repository secrets would be readable by any workflow on any branch,
    # including the Tests workflow that runs on pull requests. The key can mint
    # signing certificates and ship builds, and the .p8 cannot be re-downloaded.
    environment: testflight

    env:
      # App Store Connect rejects a build number it has seen before, so this has
      # to only ever go up. run_number is monotonic per workflow and never
      # repeats, even across force-pushes and re-runs; the offset clears the
      # builds uploaded by hand before this workflow existed.
      BUILD_OFFSET: 100

    steps:
      - uses: actions/checkout@v4

      - name: Use the newest installed Xcode
        run: |
          latest=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Selecting $latest"
          sudo xcode-select -s "$latest"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      # There is deliberately no certificate-import step. This account uses
      # cloud-managed distribution signing — Apple holds the private key and
      # signs on request — so there is no .p12 to export or install, and
      # `security find-identity` on the developer's own Mac shows only an Apple
      # Development identity. -allowProvisioningUpdates plus the API key below
      # is what reaches the cloud certificate.

      - name: Write the App Store Connect API key
        # CI can't use the interactively signed-in Xcode account, so both
        # provisioning and the upload authenticate with an API key instead.
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private_keys"
          path="$RUNNER_TEMP/private_keys/AuthKey_${ASC_KEY_ID}.p8"
          echo "$ASC_PRIVATE_KEY" | base64 --decode > "$path"
          chmod 600 "$path"
          echo "ASC_KEY_PATH=$path" >> "$GITHUB_ENV"

      - name: Generate the project
        run: |
          set -euo pipefail
          xcodegen generate

      - name: Archive
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          build_number=$(( ${{ github.run_number }} + BUILD_OFFSET ))
          echo "Building $build_number"
          echo "BUILD_NUMBER=$build_number" >> "$GITHUB_ENV"

          xcodebuild archive \
            -project bhavik-ios.xcodeproj \
            -scheme bhavik-ios \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            CURRENT_PROJECT_VERSION="$build_number"

      - name: Upload to TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>Y4M3S6H4NK</string>
              <key>signingStyle</key>
              <string>automatic</string>
              <key>uploadSymbols</key>
              <true/>
              <key>destination</key>
              <string>upload</string>
          </dict>
          </plist>
          PLIST

          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Multitrack.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$ASC_KEY_PATH" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

          echo "Uploaded build $BUILD_NUMBER — it will appear in TestFlight once processing finishes."

      - name: Clean up the API key
        # Runs even on failure so a failed archive never leaves the API key
        # sitting on the runner.
        if: always()
        run: rm -f "$ASC_KEY_PATH" || true
