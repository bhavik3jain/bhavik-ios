name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.0
        # Pinned, not "newest installed": the xcode-27 image also carries 27.1
        # and a 27.2 beta, and App Store Connect rejects a build made with a
        # beta Xcode. Moved off macos-latest (Xcode 26.6) after its compiler
        # crashed in IRGen on SharedChangeNotificationsSection.swift while the
        # app is developed on Xcode 27. The image is a GitHub preview, so jobs
        # can queue; falling back is runs-on: macos-latest plus this step
        # picking the newest Xcode again.
        run: |
          xcode=/Applications/Xcode_27.0.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Pick an iPhone simulator
        id: simulator
        # The runners' simulator line-up changes, so choose one at run time
        # rather than pinning a model that may not be installed.
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available \
                 | grep -E "^\s+iPhone" \
                 | tail -1 \
                 | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid on $(uname -m)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # A simulator is listed once per architecture, so naming the host's
          # arch keeps xcodebuild from reporting an ambiguous destination.
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Test each package
        run: |
          set -euo pipefail
          for package in Core GymTracker FuelTracker TVTracker ParcelTracker TripTracker ExploreTracker PointsTracker FinanceTracker; do
            echo "::group::$package"
            ( cd "Packages/$package" && xcodebuild test -scheme "$package" -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }},arch=${{ steps.simulator.outputs.arch }}" -quiet )
            echo "::endgroup::"
          done

      - name: Build the app
        # Catches anything that compiles per package but breaks once the
        # modules are wired together, which the package tests can't see.
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build -project bhavik-ios.xcodeproj -scheme bhavik-ios -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }},arch=${{ steps.simulator.outputs.arch }}" -quiet

      - name: Build the Mac app
        # The Mac target compiles the same sources as the iPhone one, so an
        # edit that builds for iOS can still break macOS — usually by reaching
        # for UIKit-only API, which nothing above would notice. Unsigned,
        # because a runner is not a registered Mac and cannot get a profile.
        run: |
          set -euo pipefail
          xcodebuild build -project bhavik-ios.xcodeproj -scheme bhavik-macOS -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO -quiet
