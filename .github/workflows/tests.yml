name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.0
        # Pinned, not "newest installed": the xcode-27 image also carries 27.1
        # and a 27.2 beta, and App Store Connect rejects a build made with a
        # beta Xcode. Moved off macos-latest (Xcode 26.6) after its compiler
        # crashed in IRGen on SharedChangeNotificationsSection.swift while the
        # app is developed on Xcode 27. The image is a GitHub preview, so jobs
        # can queue; falling back is runs-on: macos-latest plus this step
        # picking the newest Xcode again.
        run: |
          xcode=/Applications/Xcode_27.0.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        # xcbeautify turns xcodebuild's output into readable GitHub annotations.
        # Without it the logs were either thousands of lines or, with -quiet, a
        # red "error: the following command failed with exit code 0" after every
        # compile step that merely had warnings, which read as failures when the
        # build had passed. Every xcodebuild below pipes into it under
        # `set -o pipefail`, so a real failure still fails the step.
        run: brew install xcodegen xcbeautify

      - name: Pick an iPhone simulator
        id: simulator
        # The runners' simulator line-up changes, so choose one at run time
        # rather than pinning a model that may not be installed.
        run: |
          set -euo pipefail
          udid=$(xcrun simctl list devices available \
                 | grep -E "^\s+iPhone" \
                 | tail -1 \
                 | grep -oE "[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}")
          if [ -z "$udid" ]; then
            echo "No iPhone simulator available on this runner"
            xcrun simctl list devices available
            exit 1
          fi
          echo "Using simulator $udid on $(uname -m)"
          echo "udid=$udid" >> "$GITHUB_OUTPUT"
          # A simulator is listed once per architecture, so naming the host's
          # arch keeps xcodebuild from reporting an ambiguous destination.
          echo "arch=$(uname -m)" >> "$GITHUB_OUTPUT"

      - name: Test every package and build the app
        # One scheme (AllPackageTests in project.yml) for all nine packages, so
        # Core is compiled once and the suites run side by side. Nine separate
        # `xcodebuild test` runs took 29 minutes on this runner, nearly all of it
        # rebuilding the same dependencies. The scheme's build target is the app
        # itself, so this also catches anything that compiles per package but
        # breaks once the modules are wired together.
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild test -project bhavik-ios.xcodeproj -scheme AllPackageTests \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }},arch=${{ steps.simulator.outputs.arch }}" \
            -parallel-testing-enabled YES | xcbeautify --renderer github-actions

  mac:
    name: Build the Mac app
    # Its own job so it runs alongside the tests instead of after them. The Mac
    # target compiles the same sources as the iPhone one, so an edit that builds
    # for iOS can still break macOS — usually by reaching for UIKit-only API,
    # which the iOS job would not notice. Unsigned, because a runner is not a
    # registered Mac and cannot get a profile.
    runs-on: xcode-27

    steps:
      - uses: actions/checkout@v4

      - name: Use Xcode 27.0
        # See the test job.
        run: |
          xcode=/Applications/Xcode_27.0.app
          if [ ! -d "$xcode" ]; then
            echo "$xcode is not on this runner. Installed:"
            ls -d /Applications/Xcode*.app
            exit 1
          fi
          sudo xcode-select -s "$xcode"
          xcodebuild -version

      - name: Install XcodeGen and xcbeautify
        # See the first job.
        run: brew install xcodegen xcbeautify

      - name: Build the Mac app
        run: |
          set -euo pipefail
          xcodegen generate
          xcodebuild build -project bhavik-ios.xcodeproj -scheme bhavik-macOS -destination "platform=macOS" CODE_SIGNING_ALLOWED=NO | xcbeautify --renderer github-actions
